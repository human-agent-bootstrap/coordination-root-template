openapi: 3.1.0
info:
  title: TODO API
  version: 0.1.0-pre-feature
  description: Approved contract snapshot for CHG-TODO-001. No implementation exists in this baseline.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Service ready
  /todos:
    get:
      operationId: listTodos
      responses:
        '200':
          description: TODO list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  description: The server trims surrounding whitespace before validation and storage.
                  minLength: 1
                  maxLength: 100
                  pattern: '.*\S.*'
      responses:
        '201':
          description: Created TODO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
  /todos/{id}:
    patch:
      operationId: updateTodo
      parameters:
        - $ref: '#/components/parameters/TodoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                title:
                  type: string
                  description: The server trims surrounding whitespace before validation and storage.
                  minLength: 1
                  maxLength: 100
                  pattern: '.*\S.*'
                completed:
                  type: boolean
      responses:
        '200':
          description: Updated TODO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTodo
      parameters:
        - $ref: '#/components/parameters/TodoId'
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    Todo:
      type: object
      required: [id, title, completed, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: TODO not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
