# Per-stack CI steps for the TODO example. Copy the steps you need into
# .github/workflows/ci.yml — the template's root CI deliberately runs
# coordination checks only, because it cannot know your services' stacks.
#
# Per-service build and test properly belong to each child repository's own CI.
# These steps exist here only so the cross-repo browser E2E can run at the root.
- if: github.event_name == 'pull_request'
  run: npx playwright install --with-deps chromium
- if: github.event_name == 'pull_request'
  uses: astral-sh/setup-uv@v5
  with:
    python-version: "3.12"
- if: github.event_name == 'pull_request'
  run: uv sync --project services/back --locked --extra dev
- if: github.event_name == 'pull_request'
  run: npm ci --include=dev --prefix services/front
- if: github.event_name == 'pull_request'
  run: npm run build --prefix services/front
- if: github.event_name == 'pull_request'
  run: npm run test:e2e -- --change CHG-TODO-002
