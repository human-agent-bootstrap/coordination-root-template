# Service registry — the single source of truth for coordinated repositories.
#
# Every entry must have a matching submodule in .gitmodules, and every work unit's
# `repo:` value must resolve to an `id` here (or the `root` / `cross-repository` sentinels).
# Register a service once; each Change then declares the subset it participates in.
version: 1
services:
  - id: front
    path: services/front
    repo: https://github.com/human-agent-bootstrap/todo-collab-front.git
    stack: react-typescript
    owners:
      - "@frontend-team"
    verify:
      - npm ci
      - npm test -- --run
      - npm run lint
      - npm run typecheck
      - npm run build

  - id: back
    path: services/back
    repo: https://github.com/human-agent-bootstrap/todo-collab-back.git
    stack: python-fastapi
    owners:
      - "@backend-team"
    verify:
      - python -m pytest
      - python -m ruff check .
      - python -m mypy app
