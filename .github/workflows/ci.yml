name: Coordination validation

# The root validates coordination state only: manifests, ownership, scope, and the
# exact-SHA candidate. Per-service build and test belong to each service repository's
# own CI — this workflow cannot know your services' stacks. To run a cross-repo
# browser E2E here, add root-level tests under e2e/ and the setup steps your
# services' stacks need.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    # This job executes code from a pull request that nobody has reviewed yet, so it never
    # receives a credential or a private submodule. Where GitHub-hosted runners are
    # available, prefer `ubuntu-latest` here: a throwaway machine isolates that code for
    # free. On a self-hosted fleet, point this at an ephemeral pool kept apart from the
    # runner that `main` uses (for example `[self-hosted, linux, pr]`).
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify:registry -- --strict --allow-uninitialized
      - run: git checkout -B "${{ github.head_ref }}"
      - run: node scripts/ci-workflow-check.mjs --branch "${{ github.head_ref }}"

  main:
    if: github.event_name == 'push'
    # Only trusted main code receives the credential that reads private service
    # repositories. This job clones other repositories and calls the API with
    # COORDINATION_GITHUB_TOKEN, so it needs an IP the organization accepts: a hosted
    # runner's dynamic address is rejected wherever an enterprise IP allow list is on.
    # Use `runs-on: ubuntu-latest` only when no IP allow list applies.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.COORDINATION_GITHUB_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify:registry -- --strict
      - env:
          COORDINATION_GITHUB_TOKEN: ${{ secrets.COORDINATION_GITHUB_TOKEN }}
        run: npm run verify:candidate:ci -- --event push --before "${{ github.event.before }}" --after "${{ github.sha }}" --allow-initial-registration true
