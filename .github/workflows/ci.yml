name: Coordination validation

# The root validates coordination state only: manifests, ownership, scope, and the
# exact-SHA candidate. Per-service build and test belong to each service repository's
# own CI — this workflow cannot know your services' stacks. To run a cross-repo
# browser E2E here, add root-level tests under e2e/ and copy the per-stack setup
# steps from examples/todo/ci-snippet.yml.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      # Registry and change manifests must agree before anything else is trusted.
      - run: npm run verify:registry
      # Work-unit scope applies to the branch under review, not the merged snapshot.
      - if: github.event_name == 'pull_request'
        run: git checkout -B "${{ github.head_ref }}"
      - if: github.event_name == 'pull_request'
        run: node scripts/ci-workflow-check.mjs --branch "${{ github.head_ref }}"
      # Verify whichever candidate matches the checked-in submodule snapshot.
      - run: npm run verify:candidate -- --detect
      # Opt-in: only runs when this project has root-level cross-repo E2E tests.
      - id: e2e
        run: echo "present=${{ hashFiles('e2e/*.test.mjs') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.e2e.outputs.present == 'true'
        run: npm run test:e2e
      # The example's own suite runs only while the example is still installed.
      - id: example
        run: echo "present=${{ hashFiles('examples/todo/tests/*.test.mjs') != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.example.outputs.present == 'true'
        run: npm run test:example
