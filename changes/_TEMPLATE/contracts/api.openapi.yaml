openapi: 3.1.0
info:
  title: <API title>
  version: 0.1.0
paths:
  /<resource>:
    post:
      operationId: <createResource>
      summary: <what it does>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/<Resource>Create'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/<Resource>'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    <Resource>Create:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    <Resource>:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
